name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    name: Python suite (headless)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        # conftest.py sets SDL_VIDEODRIVER=dummy and skips suites whose
        # prerequisites (Rust wheel, star catalogues) are absent here --
        # those run in the rust-core job / locally instead.
        run: pytest

  rust-core:
    name: Rust workspace (cargo + wheel + parity, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is the actual target platform for the app.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system deps (serialport crate needs libudev)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Pure-Rust tests (workspace)
        run: cargo test --workspace --release --manifest-path rust/Cargo.toml

      - name: Build + install the PyO3 wheel (skytracker-ffi)
        shell: bash
        run: |
          pip install -r requirements.txt maturin
          maturin build --release -m rust/skytracker-ffi/Cargo.toml
          pip install rust/target/wheels/skytracker_core-*.whl

      - name: Cross-language parity + perf suite
        # With the wheel installed, conftest.py collects the test_rust_*
        # suites (byte parity, PID/hotspot/transform parity, threaded loop,
        # bridge, adapter, perf-regression guard, closed-loop A/B).
        run: pytest test_rust_pid_parity.py test_rust_hotspot_parity.py test_rust_mount_parity.py test_rust_transforms_parity.py test_rust_core_loop.py test_rust_core_loop_bridge.py test_rust_loop_adapter.py test_rust_perf.py test_rust_astro_parity.py test_rust_platesolve_parity.py test_rust_pointing_parity.py test_rust_imaging_parity.py test_rust_adsb_parity.py test_rust_camera_pipeline.py test_rust_rate_parity.py test_rust_autotune_parity.py test_loop_ab_parity.py
