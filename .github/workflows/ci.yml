name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    name: Python suite (headless)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        # conftest.py sets SDL_VIDEODRIVER=dummy and skips suites whose
        # prerequisites (Rust wheel, star catalogues) are absent here --
        # those run in the rust-core job / locally instead.
        run: pytest

  rust-core:
    name: Rust core (cargo + wheel + parity)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system deps (serialport crate needs libudev)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/skytracker_core

      - name: Pure-Rust tests
        run: cargo test --release --manifest-path rust/skytracker_core/Cargo.toml

      - name: Build + install the PyO3 wheel
        run: |
          pip install -r requirements.txt maturin
          maturin build --release -m rust/skytracker_core/Cargo.toml
          pip install rust/skytracker_core/target/wheels/skytracker_core-*.whl

      - name: Cross-language parity + perf suite
        # With the wheel installed, conftest.py collects the test_rust_*
        # suites (byte parity, PID/hotspot/transform parity, threaded loop,
        # bridge, adapter, perf-regression guard).
        run: pytest test_rust_pid_parity.py test_rust_hotspot_parity.py test_rust_mount_parity.py test_rust_transforms_parity.py test_rust_core_loop.py test_rust_core_loop_bridge.py test_rust_loop_adapter.py test_rust_perf.py
