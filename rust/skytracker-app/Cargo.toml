[package]
name = "skytracker-app"
description = "Hat Creek Skytracker — the native egui+wgpu application (Phase 7 of the Rust port): 120 Hz display over the Rust engines"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "skytracker"
path = "src/main.rs"

[features]
default = ["serial", "mp4-export"]
serial = ["skytracker-core/serial"]
# H.264 MP4 export for the replay screen (openh264 compiled from bundled
# C++ source via skytracker-imaging). Disable with --no-default-features
# if the C++ toolchain is unavailable; the Export MP4 button then reports
# "not compiled in".
mp4-export = ["skytracker-imaging/mp4-export"]

[dependencies]
skytracker-core = { workspace = true }
skytracker-astro = { path = "../skytracker-astro" }
skytracker-camera = { path = "../skytracker-camera" }
skytracker-imaging = { path = "../skytracker-imaging" }
skytracker-platesolve = { path = "../skytracker-platesolve" }
skytracker-pointing = { path = "../skytracker-pointing" }
skytracker-adsb = { path = "../skytracker-adsb" }

eframe = { version = "0.29", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
egui = "0.29"
egui_extras = { version = "0.29", default-features = false }
arc-swap = "1"
crossbeam-channel = "0.5"
gilrs = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg"] }
rayon = "1"
libloading = "0.8"
serialport = { workspace = true }
