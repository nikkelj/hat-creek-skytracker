[package]
name = "skytracker_core"
version = "0.1.0"
edition = "2021"
description = "Rust core for the Hat Creek Skytracker (experiment: Rust-core / Python-shell split)"
license = "MIT"

[lib]
name = "skytracker_core"
# cdylib: the Python extension module (built by maturin).
# rlib:   so `cargo test` can exercise the pure-Rust protocol/sim modules.
crate-type = ["cdylib", "rlib"]

[dependencies]
# pyo3 + numpy are OPTIONAL and only pulled in for the extension-module build.
# This keeps `cargo test` pure Rust with zero libpython linkage, so the
# protocol/sim/pid/hotspot logic tests run without a Python interpreter.
pyo3 = { version = "0.22", optional = true }
numpy = { version = "0.22", optional = true }
# serialport backs the real hardware Transport; only needed for the extension.
serialport = { version = "4.5", optional = true }
# ndarray is used by the pure-Rust hotspot core, so it is a default dependency.
ndarray = "0.16"

[features]
default = []
extension-module = ["dep:pyo3", "dep:numpy", "dep:serialport", "pyo3/extension-module"]
