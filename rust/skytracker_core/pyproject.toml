[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "skytracker_core"
description = "Rust core for the Hat Creek Skytracker (experiment)"
requires-python = ">=3.11"
dynamic = ["version"]

[tool.maturin]
# Build the cdylib as a Python extension module named `skytracker_core`.
features = ["extension-module"]
module-name = "skytracker_core"
